services:
  - type: web
    name: msk-ai-chatbot
    env: docker
    autoDeploy: true
    plan: starter
    disk:
      name: msk-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: EMBEDDING_MODEL
        value: models/gemini-embedding-001
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: RAW_PDF_DIR
        value: /var/data/raw_pdfs
      - key: PROCESSED_CHUNKS_PATH
        value: /var/data/processed/chunks.jsonl
      - key: CHROMA_PERSIST_DIR
        value: /var/data/vectordb
      - key: TOP_K_RESULTS
        value: 5
      - key: MAX_CONTEXT_CHUNKS
        value: 8
      - key: TEMPERATURE
        value: 0.2
      - key: CHUNK_SIZE
        value: 800
      - key: CHUNK_OVERLAP
        value: 200
